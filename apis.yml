name: Mammoth Biosciences
description: >-
  Mammoth Biosciences is a genetic medicines company co-founded by CRISPR
  co-inventor Jennifer Doudna, developing in vivo gene-editing therapeutics and
  CRISPR-based diagnostics. The company discovers and engineers novel CRISPR
  systems and proteins to overcome delivery challenges in genetic medicine, with
  the goal of creating permanent cures. It is a therapeutics- and
  diagnostics-focused biotechnology company rather than an API/platform provider;
  as of this enrichment pass it publishes no public developer API, SDK,
  documentation portal, or programmatic access. This profile was surfaced as a
  portfolio company of 8vc, Mayfield and SV Angel and added to the API Evangelist
  network.
